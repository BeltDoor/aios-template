:root{
  /* Layout idea: one wide canvas on a 4 pixel grid. The top row is the perfect run; every other box hangs one column to its right. */
  --night:#121212;--ink:#F7F6F2;--ink-2:#CBC9C0;--ink-3:#9A988F;--ink-4:#6A675E;--thin:#7D7A70;
  --gold:#DC990A;--gold-bright:#E8B23A;--gold-light:#F4E8AC;
  --glass:rgba(255,255,255,.04);--hair:rgba(255,255,255,.07);--hair-2:rgba(255,255,255,.16);
  --sg:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--in:"Inter",ui-sans-serif,system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-move:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--ease-smooth:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.32,.44,1);
  --w:208px;--h:96px;--gx:64px;--gy:64px;--band:40px;--pad:20px;--k:1;
}
/* On a phone the boxes sit a little closer, so the first screen already shows a line dropping from the second box. */
@media (max-width:767px){:root{--w:192px;--gx:48px}}
@media (min-width:768px){:root{--pad:40px}}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{background-color:var(--night);-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-y:auto}
body{margin:0;background:transparent;color:var(--ink);font:400 15px/1.5 var(--in);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--gold-dust-room) center/cover no-repeat;opacity:.1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
.box:focus-visible{outline-offset:-4px}
p,h1,h2,ul,dl,dd,figure{margin:0;padding:0}
ul{list-style:none}

/* the head of the page */
.mast{display:flex;align-items:flex-start;gap:12px;padding:12px var(--pad) 16px;animation:fade-up .75s var(--ease-spring) backwards}
.mono{display:block;flex:none;width:28px;height:auto}
.ttl{min-width:0}
h1{font:700 clamp(30px,8.8vw,34px)/1 var(--sg);letter-spacing:-.045em;color:var(--ink)}
.lede{margin-top:8px;font-size:15px;line-height:20px;color:var(--ink-2);max-width:36em}

.keycap:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.28),0 1px 0 #6e4d04,0 3px 8px -4px rgba(0,0,0,.55)}
@media (max-width:389px){

}

}
/* A mouse has no finger, so on a laptop the head's buttons stay small and the gold line keeps the page's gold. */
@media (min-width:1024px) and (hover:hover) and (pointer:fine){

}

/* the stage */
.stage{position:relative;overflow:clip;padding-bottom:72px}
@media (min-width:1024px){.stage{padding-bottom:0}}
.sweep-light{position:absolute;top:0;bottom:0;left:-4px;width:2px;opacity:0;pointer-events:none;z-index:6;background:linear-gradient(180deg,transparent,var(--gold-bright) 30%,var(--gold) 70%,transparent);animation:section-sweep .9s var(--ease-smooth) .2s 1 both}
.map{position:relative;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;cursor:grab;-webkit-user-select:none;user-select:none;animation:sweep-reveal .9s var(--ease-smooth) .2s 1 backwards}
.map.frozen{overflow-x:hidden;overflow-y:hidden;scroll-snap-type:none}
body.dragging .map{cursor:grabbing}
@media (max-width:767px){.map{scroll-snap-type:x proximity}.box.top{scroll-snap-align:center}}
@keyframes section-sweep{0%{transform:translateX(0);opacity:0}10%{opacity:1}82%{transform:translateX(var(--sweep-w,100vw));opacity:1}100%{transform:translateX(var(--sweep-w,100vw));opacity:0}}
@keyframes sweep-reveal{0%{clip-path:inset(-2% 102% -2% -2%)}82%,100%{clip-path:inset(-2% -2% -2% -2%)}}
@keyframes fade-up{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}

/* the canvas: one grid, every step on it */
.canvas{position:relative;display:grid;width:max-content;grid-template-columns:repeat(6,var(--w)) 0 repeat(4,var(--w));grid-template-rows:repeat(4,var(--h));column-gap:var(--gx);row-gap:var(--gy);padding:var(--band) var(--pad) 0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.ln{fill:none;transition:opacity 160ms ease}
.ln.run{stroke:var(--gold);stroke-width:var(--sw-run,3px)}
.ln.branch,.ln.rise{stroke:var(--thin);stroke-width:var(--sw-thin,1px)}
.head{transition:opacity 160ms ease}
.head.run{fill:var(--gold)}
.head.thin{fill:var(--thin)}
.fil{fill:none;stroke:var(--gold-light);stroke-linecap:round;animation:fil-run 16s linear infinite}
@keyframes fil-run{from{stroke-dashoffset:var(--a)}72%,100%{stroke-dashoffset:var(--b)}}

/* the boxes */
.box{position:relative;z-index:2;width:var(--w);height:var(--h);display:flex;flex-direction:column;justify-content:space-between;padding:12px 16px;border:1px solid var(--hair-2);border-radius:14px;background:var(--glass);color:var(--ink-2);text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);touch-action:manipulation;transition:transform 120ms var(--ease-out),border-color 160ms ease,background-color 160ms ease,color 160ms ease,opacity 160ms ease}
.box:active{transform:scale(.97)}
.box.top{border-width:1.5px;padding:11.5px 15.5px;border-color:var(--gold);color:var(--ink)}
.box.final{border:3px solid var(--gold);padding:10px 14px;box-shadow:inset 0 0 0 1px rgba(220,153,10,.45)}
.box.gone{background:transparent;border-color:var(--hair);box-shadow:none;color:var(--ink-3)}
.box.notrun{border-style:dashed;border-color:var(--thin)}
.box.top.notrun{border-color:var(--gold)}
.box.on{border-color:var(--gold-bright);border-style:solid;background:rgba(220,153,10,.08);color:var(--ink)}
.box.arrive{border-color:var(--gold-bright);background:rgba(220,153,10,.08)}
.box::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;border:1px solid transparent;opacity:0;transition:opacity 300ms linear;background:radial-gradient(170px circle at var(--mx,50%) var(--my,0%),var(--gold-bright),var(--gold) 40%,var(--hair) 75%) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);mask-composite:exclude}
@media (hover:hover) and (pointer:fine){.box:hover::after{opacity:1}.box:hover{color:var(--ink)}}
.t{display:block;font:600 17px/21px var(--sg);text-wrap:balance;transition:opacity 200ms ease}
.t2{position:absolute;inset:0;display:flex;align-items:center;padding:0 calc(5px*var(--k));font:600 calc(13px*var(--k))/1.14 var(--sg);text-wrap:balance;opacity:0;pointer-events:none}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px;color:var(--ink-3);transition:opacity 200ms ease}
.who{display:flex;align-items:center;gap:8px}
.mk{display:block;flex:none}
.mk.crown{color:var(--gold-bright)}
.box.low .mk.crown,.key .mk.crown{color:var(--ink-3)}
.box.gone .mk.crown{color:var(--ink-4)}
.tag{font:500 13px/16px var(--in);color:var(--ink-3);white-space:nowrap}
.walking .box.top:not(.lit){border-color:rgba(220,153,10,.3);color:var(--ink-3)}
.walking .ln.run:not(.lit),.walking .head.run:not(.lit){opacity:.28}
.walking .box.low,.walking .lab,.walking .ln.branch,.walking .ln.rise,.walking .head.thin{opacity:.28}
.walking .fil{visibility:hidden}

/* words on the lines: each condition sits against the end of its arrow, so it stays beside its box at every phone stop */
.lab{position:absolute;z-index:3;max-width:80px;font:500 13px/16px var(--in);color:var(--ink-3);text-align:right;text-wrap:balance;transition:opacity 160ms ease}

/* the one big moment: the foil is one strip, as tall as the canvas, seen through both pieces */
.rule-a,.rule-b{position:absolute;z-index:1;width:calc(4px*var(--k));background:var(--gold-foil) 0 0/100% var(--foil-h,640px)}
.rule-crown{position:absolute;z-index:1;display:block;color:var(--gold)}

.rule-sales{color:var(--ink-3)}
.ghost{position:absolute;z-index:0;font:700 144px/.9 var(--sg);letter-spacing:-.05em;color:rgba(255,255,255,.06);white-space:nowrap;pointer-events:none}

/* the key sits in the map's own corner */
.key{grid-column:1;grid-row:3/5;align-self:end;z-index:2;display:grid;gap:4px;font:400 13px/20px var(--in);color:var(--ink-3);transition:opacity 200ms ease}
.key li{display:flex;align-items:center;gap:8px;min-height:20px}
.key-m{display:grid;place-items:center;flex:none;width:24px}
.key-dash{display:block;flex:none;width:24px;height:14px;border:1px dashed var(--thin);border-radius:4px}
.key-here{display:block;flex:none;width:14px;height:14px;border:2px solid var(--ink);border-radius:4px}

/* whole map */
.cap{display:none;align-items:center;justify-content:space-between;gap:16px;min-height:48px;padding:0 var(--pad);font:500 15px/24px var(--in);color:var(--ink-3)}
.cap-keys{display:inline-flex;align-items:center;gap:16px}
.cap small{display:inline-flex;align-items:center;gap:8px;font:500 13px/16px var(--in);letter-spacing:0;color:var(--ink-3);white-space:nowrap}
.cap small[hidden]{display:none}
.ov .cap{display:flex}
.holding .cap{visibility:hidden}
.ov .map{cursor:default;touch-action:pinch-zoom}
.ov .box{cursor:pointer}
.ov .key{visibility:hidden;pointer-events:none}
.ov:not(.holding) .box{border-width:calc(1px*var(--k));padding:0}
.ov:not(.holding) .box.top{border-width:calc(1.5px*var(--k));border-width:round(up,calc(1.5px*var(--k)),1px);padding:0}
.ov:not(.holding) .box.final{border-width:calc(2px*var(--k));box-shadow:none}
.ov:not(.holding) .t,.ov:not(.holding) .foot{opacity:0;pointer-events:none;transition:none}
.ov:not(.holding) .t2{opacity:1;transition:opacity 160ms ease}
.ov:not(.holding) .lab{font-size:calc(13px*var(--k));line-height:calc(15px*var(--k));max-width:calc(60px*var(--k))}
.ov:not(.holding) .rule-sales,.ov:not(.holding) .rule-care{top:calc(-2px*var(--k));font-size:calc(17px*var(--k));line-height:1}
.holding .lab,.beads .lab,.ov .lab.up{visibility:hidden}
.ov .ghost{color:rgba(255,255,255,.07)}
.ov .ghost.first{display:none}
.beads{--h:192px;--gy:128px}
.beads .ln.rise{display:none}
.beads .t2,.beads .rule-care,.beads .rule-sales{display:none}
.beads .box.top{background:var(--gold);border-color:var(--gold)}
.beads .box.top.notrun{background:transparent}

.beads .box.low.notrun{background:transparent;border-color:var(--ink-3)}

.beads .cap{position:absolute;left:0;right:0;justify-content:center;font:600 20px/24px var(--sg);color:var(--ink-2);text-align:center}
.beads #capText{text-wrap:balance}
.beads .cap-keys{position:absolute;left:0;right:0;top:calc(100% + var(--keys-gap,16px));justify-content:center}
.box.near{outline:calc(2px*var(--k)) solid var(--gold-light);outline-offset:calc(1px*var(--k))}
.ov:not(.holding) .box.here:not(.near){outline:calc(2px*var(--k)) solid var(--ink);outline-offset:calc(2px*var(--k))}

/* the detail: a bottom sheet on a phone, a quiet panel on a laptop */
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:66dvh;border-radius:20px 20px 0 0;border-top:1px solid var(--gold);background:rgba(26,26,26,.96);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);transform:translateY(106%);visibility:hidden;transition:transform 220ms var(--ease-drawer),visibility 0s linear 220ms}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform 320ms var(--ease-drawer)}
.sheet.held{transition:none}
.crest{position:absolute;top:-11px;left:50%;margin-left:-16px;color:var(--gold);pointer-events:none}
.grab{flex:none;height:24px;touch-action:none;cursor:grab}
.x{position:absolute;top:4px;right:4px;z-index:2;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:var(--ink-3);transition:color 160ms ease,transform 120ms var(--ease-out)}
.x:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.x:hover{color:var(--ink)}}
.sh-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex}
.sh-body{flex:1;min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 16px}
.sh-fade{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;color:var(--ink-2);background:linear-gradient(180deg,rgba(26,26,26,0),rgba(26,26,26,.96) 72%);pointer-events:none;opacity:0;transition:opacity 150ms ease}

.kick{font:600 13px/16px var(--sg);letter-spacing:.02em;color:var(--gold-bright);padding-right:40px}

.say{margin-top:8px;font-size:15px;line-height:22px;color:var(--ink-2);text-wrap:pretty}
.pic{margin-top:12px}
.pic svg{display:block;width:100%;height:auto;color:var(--gold)}

.next{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}

.chips{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:12px}

.morebtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-top:4px;font:500 13px/16px var(--in);color:var(--ink-3);transition:color 160ms ease}

@media (hover:hover) and (pointer:fine){.morebtn:hover{color:var(--ink)}}

.walk-time{position:absolute;left:0;right:0;top:0;height:1px;display:none;background:var(--gold-light);transform-origin:0 50%;transform:scaleX(0)}

/* A phone with its browser bars showing is short: the walk keeps every word of a step on screen. */

.sheet .rows{margin:0;gap:0}

.sheet .pic{margin:0;padding:8px 0;border-top:1px solid var(--hair)}

.sheet .nrline b{color:var(--gold-bright)}
.sheet .fine{margin:0;padding:8px 0 0;gap:4px}
.sheet .fine li{color:var(--ink-3)}
.sopbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0;border-top:1px solid var(--hair);font:400 13px/20px var(--in);color:var(--ink-3);transition:color 160ms ease}

.sop{position:fixed;left:0;right:0;bottom:0;z-index:35;display:none;height:var(--sop-h,60dvh);min-height:200px;max-height:calc(100dvh - 96px);border-top:1px solid var(--gold);background-color:rgba(26,26,26,.97);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.sop.open{display:grid;grid-template-columns:296px 340px minmax(0,1fr)}

.sop-grip::after{content:"";position:absolute;left:50%;top:24px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background-color:var(--hair-2);transition:background-color 160ms ease}
.sop.sizing .sop-grip::after{background-color:var(--gold)}
@media (hover:hover) and (pointer:fine){.sop-grip:hover::after{background-color:var(--gold)}}
.sop-col{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--hair)}
.sop-col:last-child{border-right:0}
.sop-hd{position:relative;z-index:4;display:flex;margin-top:8px;align-items:center;justify-content:space-between;gap:8px;flex:none;height:44px;padding:0 16px;border-bottom:1px solid var(--hair);font:500 13px/16px var(--in);color:var(--ink-3);white-space:nowrap}
.sop-hd span{overflow:hidden;text-overflow:ellipsis}
.sop-hd b{font-weight:500;color:var(--ink)}
.sop-x{display:grid;place-items:center;flex:none;width:44px;height:44px;margin-right:-12px;border-radius:10px;color:var(--ink-3);transition:color 160ms ease}
.sop-scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto}
.sop-list{padding:4px}
.sop-item{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:4px 12px;border-radius:8px;text-align:left;font:500 13px/16px var(--in);color:var(--ink-2);transition:background-color 160ms ease,color 160ms ease}
.sop-item span{flex:1;min-width:0;text-wrap:pretty}
.sop-item small{flex:none;font:400 13px/16px var(--in);color:var(--ink-4)}
.sop-item svg{flex:none;color:var(--ink-4)}
.sop-item[aria-selected="true"]{background-color:rgba(255,255,255,.07);color:var(--ink)}
.sop-item[aria-selected="true"] svg{color:var(--gold-bright)}
.sop-parts{margin:0}
.sop-parts>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:8px 16px;border-bottom:1px solid var(--hair)}
.sop-parts dt{font:400 13px/20px var(--in);color:var(--ink-3)}
.sop-parts dd{margin:0;font-size:13px;line-height:20px;color:var(--ink);text-wrap:pretty}
.sop-ul{margin:0;padding:0;list-style:none}
.sop-ul li{position:relative;padding-left:12px}
.sop-ul li::before{content:"";position:absolute;left:0;top:9px;width:3px;height:3px;border-radius:50%;background-color:var(--ink-3)}
.sop-ul em{margin-left:8px;font-style:normal;color:var(--gold-bright)}
.sop-wh{display:grid;gap:4px}
.sop-wh+.sop-wh{margin-top:8px}
.sop-wh b{display:flex;align-items:center;gap:8px;font-weight:500}
.sop-who img.mk,.sop-wh img.mk{width:16px;height:16px;border-radius:4px}
.sop-who img.face,.sop-wh img.face{width:20px;height:20px;border-radius:50%;object-fit:cover}
img.mk{border-radius:4px}
.sop-tools{display:flex;gap:8px}
.sop-tool{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--hair-2);border-radius:8px;background-color:rgba(255,255,255,.03)}
.sop-tool img{display:block;border-radius:4px}
.sop-none{padding:16px;font-size:13px;line-height:20px;color:var(--ink-3)}
.sop-steps{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:20px}
.sop-steps th{position:sticky;top:0;z-index:1;height:32px;padding:0 12px;border-bottom:1px solid var(--hair);background-color:#1c1c1c;text-align:left;font:400 13px/16px var(--in);color:var(--ink-3);white-space:nowrap}
.sop-steps td{padding:8px 12px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--ink-2);text-wrap:pretty}
.sop-steps .c-n{width:40px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sop-steps .c-do{width:21%;color:var(--ink);font-weight:500}
.sop-steps .c-who{width:96px}
.sop-steps .c-when{width:12%}
.sop-steps .c-run{width:15%}
.sop-who{display:flex;align-items:center;gap:8px;color:var(--ink)}
.sop-who .mk{width:16px}
.art{display:grid;gap:0 8px;align-items:center;max-width:300px;padding:8px 12px;border:1px solid var(--hair-2);border-radius:8px;background-color:rgba(255,255,255,.03);font-size:13px;line-height:18px;color:var(--ink-2)}
.art b{font-weight:500;color:var(--ink)}
.art small{font-size:13px;color:var(--ink-3)}
.art svg,.art img{display:block;flex:none}
.art.mail{grid-template-columns:16px minmax(0,1fr) auto}
.art.mail span{grid-column:2/4}
.art.mail small{grid-column:3;grid-row:1}
.art.crm{grid-template-columns:28px minmax(0,1fr) auto}
.art.crm img{grid-row:1/3;border-radius:6px;background-color:#fff;object-fit:contain}
.art.crm span{grid-column:2;grid-row:2;color:var(--ink-3)}
.art.crm small{grid-column:3;grid-row:1;padding:0 6px;border:1px solid var(--hair-2);border-radius:4px}
.art.crm em{grid-column:1/4;margin-top:6px;padding-top:6px;border-top:1px solid var(--hair);font-style:normal;color:var(--gold-bright)}
.art.draft{grid-template-columns:16px auto minmax(0,1fr)}
.art.draft small{text-align:right}
.art.draft span{grid-column:1/4;margin-top:4px}
.art.gap{grid-template-columns:auto minmax(32px,1fr) auto;border:0;padding:20px 0 4px;background:none}
.art.gap span{display:grid}
.art.gap i{position:relative;height:1px;margin:0 4px;background-color:var(--gold);font-style:normal}
.art.gap i::before,.art.gap i::after{content:"";position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background-color:var(--gold)}
.art.gap i::before{left:-4px}
.art.gap i::after{right:-4px}
.art.gap u{position:absolute;left:50%;top:-22px;transform:translateX(-50%);text-decoration:none;white-space:nowrap;color:var(--gold-bright)}
.art.cal{grid-template-columns:40px minmax(0,1fr);gap:0 12px}
.cal-d{display:grid;justify-items:center;border:1px solid var(--hair-2);border-radius:6px;overflow:hidden}
.cal-d small{width:100%;text-align:center;background-color:rgba(255,255,255,.08);color:var(--ink-2)}
.cal-d b{font:600 17px/24px var(--sg)}
.cal-t{display:grid;grid-template-columns:16px minmax(0,1fr);gap:0 8px;align-items:center}
.cal-t small{grid-column:2}
.sop-run b{display:block;font-weight:500;color:var(--ink)}
.sop-run.new b{color:var(--gold-bright)}
.sop-run span{color:var(--ink-3)}
@media (max-width:1099px){
  .sop{border-radius:20px 20px 0 0}
  .sop.open{display:block;overflow-y:auto}
  .sop-col{border-right:0}
  .sop-scroll{overflow:visible}
  .sop-steps thead{display:none}
  .sop-steps,.sop-steps tbody{display:block}
  .sop-steps tr{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 0;padding:12px 16px;border-bottom:1px solid var(--hair)}
  .sop-steps td{grid-column:2;width:auto;padding:0;border:0}
  .sop-steps .c-n{grid-column:1;grid-row:1;width:auto}
}

@media (prefers-reduced-motion:reduce){
  .mast,.map,.sweep-light{animation:none}
  .sweep-light{display:none}
  .fil{animation:none;stroke-dashoffset:var(--park)}
  .box,.t,.t2,.foot,.key,.quiet,.keycap,.x,.rule-care,.rule-sales,.morebtn{transition:opacity 150ms ease,color 150ms ease,border-color 150ms ease,background-color 150ms ease}
  .box:active,.quiet:active,.keycap:active,.x:active{transform:none}
  .sheet,.sheet.open,.sheet.held{transform:none;opacity:0;transition:opacity 150ms ease,visibility 0s linear 150ms}
  .sheet.open{opacity:1;transition:opacity 150ms ease}
}
</style>
</head>

  if (!d.moved) return;
  ignoreClickUntil = performance.now() + 60;
  map.style.scrollSnapType = '';
  if (reduced()) return;
  let v = d.v * 16;
  const coast = () => { if (Math.abs(v) < .4) { coastRaf = 0; return; } map.scrollLeft -= v; v *= .94; coastRaf = requestAnimationFrame(coast); };
  coastRaf = requestAnimationFrame(coast);
});
addEventListener('pointercancel', (e) => {
  fingers.delete(e.pointerId);
  if (scrubbing) { clearNear(); if (mode === 'ov') $('capText').textContent = defaultCap(); }
  scrubbing = false; drag = null; body.classList.remove('dragging');
});
// A mouse wheel moves the canvas sideways. A trackpad's own sideways swipe is left alone, it already does.
map.addEventListener('wheel', (e) => {
  if (mode === 'ov' || e.ctrlKey) return;
  if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  const pageScrolls = document.documentElement.scrollHeight > innerHeight + 1;
  const mouseWheel = e.deltaMode === 1 || (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 80);
  if (pageScrolls && !mouseWheel) return;
  const maxL = canvas.offsetWidth - map.clientWidth, next = clamp(map.scrollLeft + e.deltaY * (e.deltaMode === 1 ? 32 : 1), 0, maxL);
  if (next === map.scrollLeft) return;
  e.preventDefault();
  map.scrollLeft = next;
}, { passive: false });
// The sheet flicks shut, on the velocity, with friction if it is pulled up. Its top edge always can; its words can when they are scrolled to their top.
let pull = null;
function letGo(p, at) {
  sheet.classList.remove('held');
  const v = p.dy / Math.max(1, at - p.t);
  sheet.style.transform = '';
  if (p.dy > p.h * .3 || v > .11) { stopWalk(); closeSheet(); }
}
$('grab').addEventListener('pointerdown', (e) => {
  if (!phone() || reduced()) return;
  pull = { y: e.clientY, t: e.timeStamp, h: sheet.offsetHeight, dy: 0 };
  $('grab').setPointerCapture(e.pointerId);
  sheet.classList.add('held');
});
$('grab').addEventListener('pointermove', (e) => {
  if (!pull) return;
  const raw = e.clientY - pull.y;
  pull.dy = raw < 0 ? raw * .2 : raw;
  sheet.style.transform = 'translateY(' + pull.dy + 'px)';
});
$('grab').addEventListener('pointerup', (e) => { if (!pull) return; const p = pull; pull = null; letGo(p, e.timeStamp); });
$('grab').addEventListener('pointercancel', () => { pull = null; sheet.classList.remove('held'); sheet.style.transform = ''; });
let wordPull = null;
shBody.addEventListener('touchstart', (e) => {
  wordPull = phone() && !reduced() && e.touches.length === 1 && shBody.scrollTop <= 0 ? { y: e.touches[0].clientY, t: e.timeStamp, h: sheet.offsetHeight, dy: 0, on: false } : null;
}, { passive: true });
shBody.addEventListener('touchmove', (e) => {
  if (!wordPull) return;
  const raw = e.touches[0].clientY - wordPull.y;
  if (!wordPull.on) {
    if (raw < -4) { wordPull = null; return; }
    if (raw < 8) return;
    wordPull.on = true;
    wordPull.y += raw;
    sheet.classList.add('held');
  }
  if (e.cancelable) e.preventDefault();
  wordPull.dy = Math.max(0, e.touches[0].clientY - wordPull.y);
  sheet.style.transform = 'translateY(' + wordPull.dy + 'px)';
}, { passive: false });
shBody.addEventListener('touchend', (e) => { if (!wordPull) return; const p = wordPull; wordPull = null; if (p.on) letGo(p, e.timeStamp); });
shBody.addEventListener('touchcancel', () => { if (wordPull && wordPull.on) { sheet.classList.remove('held'); sheet.style.transform = ''; } wordPull = null; });

/* ---------- start ---------- */
let resizeRaf = 0, lastW = innerWidth;
function layout() {
  document.documentElement.style.setProperty('--sweep-w', innerWidth + 'px');
  if (mode === 'ov') settleMap(); else draw();
  // a turned phone keeps the open box beside its detail; the browser bars coming and going leave the page alone
  if (innerWidth !== lastW && selected && mode === 'normal') bringIntoView(box(selected));
  lastW = innerWidth;
  updateFade();
}
addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(layout); });
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
// A laptop opens on the whole picture when its titles can really be read at that size. A phone opens on the first box.
const startOnMap = !phone() && fitPlan().s >= TEXT_MAP_AT;
if (startOnMap) {
  mode = 'ov'; body.classList.add('ov'); map.classList.add('frozen'); $('bWhole').textContent = 'Normal size';
  settleMap();
  $('capText').textContent = defaultCap();
}
setState();
</script>
</body>
